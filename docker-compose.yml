version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: file_archaeologist_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: file_archaeologist
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/stored_procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
