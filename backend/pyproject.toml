[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-archaeologist"
version = "1.0.0"
description = "Local-first desktop application for semantic and filename discovery of personal files"
authors = [{ name = "File Archaeologist Team" }]
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "SQLAlchemy>=2.0.0",
    "PyMySQL>=1.1.0",
    "watchdog>=4.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0"
]
