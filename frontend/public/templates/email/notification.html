<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferret-Unbury Notification</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1F3A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #0B1F3A;
      padding: 40px 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 16px;
      overflow: hidden;
    }
    .header {
      padding: 32px 40px;
      background-color: #0B1F3A;
      border-bottom: 1px solid #1E293B;
      text-align: center;
    }
    .content {
      padding: 40px;
      line-height: 1.6;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #FFFFFF;
      margin: 0 0 16px;
    }
    .text {
      font-size: 14px;
      color: #94A3B8;
      margin: 0 0 20px;
    }
    .callout {
      background-color: #0B1F3A;
      border-left: 4px solid #007AFF;
      padding: 16px 20px;
      border-radius: 8px;
      margin: 24px 0;
      font-size: 13px;
      color: #E2E8F0;
    }
    .button-container {
      text-align: center;
      margin: 32px 0;
    }
    .button {
      display: inline-block;
      padding: 14px 28px;
      background-color: #007AFF;
      color: #FFFFFF !important;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
    }
    .footer {
      padding: 24px 40px;
      background-color: #0B1F3A;
      border-top: 1px solid #1E293B;
      text-align: center;
      font-size: 12px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="container" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td class="header">
          <!-- Primary logo in header with absolute URL, width attribute, and alt="Ferret-Unbury" -->
          <img
            src="https://ferret-unbury.app/brand/ferret-unbury-primary.svg"
            width="200"
            height="53"
            alt="Ferret-Unbury"
            style="display: inline-block; border: 0; outline: none; text-decoration: none;"
          />
        </td>
      </tr>
      <tr>
        <td class="content">
          <h1 class="title">{{notification_title}}</h1>
          <p class="text">
            {{notification_body}}
          </p>
          <div class="callout">
            <strong>System Status:</strong> All monitored directories are synchronized and up to date.
          </div>
          <div class="button-container">
            <a href="https://ferret-unbury.app/activity" class="button">View Activity Log</a>
          </div>
        </td>
      </tr>
      <tr>
        <td class="footer">
          &copy; 2026 Ferret-Unbury. All rights reserved.<br>
          Local-First Document Intelligence &bull; Deterministic Semantic Engine
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
