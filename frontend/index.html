    <!-- Inline Splash Screen Styles (Rendered before external CSS) -->
    <style>
      :root {
        --brand-navy: #0B1F3A;
        --brand-blue: #007AFF;
        --brand-white: #FFFFFF;
      }
      #brand-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: var(--brand-navy);
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        opacity: 1;
        visibility: visible;
        transition: opacity 300ms ease, visibility 300ms ease;
      }
      #brand-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: splashEntrance 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .splash-logo {
        width: 140px;
        height: 140px;
        display: block;
        border-radius: 30px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.12);
        animation: splashPulse 2.4s ease-in-out infinite;
      }
      @media (min-width: 640px) {
        .splash-logo {
          width: 160px;
          height: 160px;
          border-radius: 35px;
        }
      }
      @keyframes splashEntrance {
        0% {
          opacity: 0;
          transform: scale(0.92);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splashPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.03);
          opacity: 0.92;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-container,
        .splash-logo,
        #brand-splash {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

    <!-- Splash dismiss & safety handler -->
    <script>
      (function() {
        function dismiss() {
          var splash = document.getElementById('brand-splash');
          if (!splash || splash.dataset.dismissed) return;
          splash.dataset.dismissed = 'true';
          splash.classList.add('fade-out');
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 320);
        }
        window.dismissBrandSplash = dismiss;
        // Safety timeout: dismiss after 8 seconds if application fails to signal
        setTimeout(dismiss, 8000);
      })();
    </script>
